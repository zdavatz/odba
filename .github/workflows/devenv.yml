name: "devenv test using a real postgres database"

on:
  pull_request:
  push:

jobs:
  tests:
    strategy:
      # without this a failure on one OS cancels the other, hiding its result
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    # v26 cannot provision Nix build users on current macos-latest images: it
    # fails in "Setting up the build user _nixbld1" with eDSRecordAlreadyExists
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v16
      with:
        name: devenv
    - name: Install devenv.sh
      run: nix profile install nixpkgs#devenv

    - name: Build the devenv shell and run any pre-commit hooks
      run: devenv test

    - name: Run the example.rb which uses a real database
      shell: devenv shell bash -- -e {0}
      run: |
        devenv up --detach
        devenv shell bundle exec ruby test/example.rb
